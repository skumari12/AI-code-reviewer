<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Code Reviewer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <header>

        <h1>AI Code Reviewer</h1>

        <p>
            Analyze your code, detect issues and get improvement suggestions.
        </p>

    </header>


    <main>

        <section class="editor-section">

            <div class="top-bar">

                <label for="language">Language:</label>

                <select id="language">

                    <option value="python">Python</option>

                    <option value="javascript">JavaScript</option>

                </select>

            </div>


            <textarea id="code" placeholder="Write or paste your code here..."></textarea>


            <button onclick="reviewCode()">
                Review Code
            </button>

        </section>


        <section class="result-section">

            <div class="score-card">

                <h2>Code Quality</h2>

                <div id="score">
                    0
                </div>

                <p id="quality">
                    Waiting for review...
                </p>

            </div>


            <div class="summary">

                <h2>Summary</h2>

                <p id="summary">
                    Submit your code to start the review.
                </p>

            </div>


            <div class="issues">

                <h2>Detected Issues</h2>

                <div id="issues-container">

                    <p>No issues detected yet.</p>

                </div>

            </div>

        </section>

    </main>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - AI Code Reviewer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>AI Code Reviewer</h1>

            <h2>Login</h2>


            {% with messages =
            get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <div class="message">

                            {{ message }}

                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form method="POST">

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required
                >


                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >


                <button type="submit">

                    Login

                </button>

            </form>


            <p class="auth-link">

                Don't have an account?

                <a href="{{ url_for('signup') }}">

                    Create Account

                </a>

            </p>

        </div>

    </div>

</body>

</html>
